name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o fgaperf .
      # The load path is concurrent; run the race detector so data races fail
      # CI rather than surfacing as flaky numbers.
      - run: go test -race ./...

  # End-to-end: run the full pipeline against a real OpenFGA server (in-memory
  # datastore is fine for functional validation) and verify that the automatic
  # cleanup deleted the store it created. Matrixed across a pinned current
  # version and `latest` so API drift fails CI early.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openfga: [v1.17.1, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o fgaperf .
      - name: Start OpenFGA ${{ matrix.openfga }}
        run: |
          # Publish the gRPC port (8081) alongside HTTP (8080) so the gRPC
          # transport smoke below can reach the server.
          docker run -d --name openfga -p 8080:8080 -p 8081:8081 openfga/openfga:${{ matrix.openfga }} run
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "OpenFGA did not become healthy" >&2
          docker logs openfga >&2
          exit 1
      - name: Run full pipeline against the example model (check)
        run: ./fgaperf all -config examples/config.yaml -warmup 2s -duration 8s
      # Exercise the list endpoints too, so a regression in list-objects /
      # list-users fails CI rather than surfacing only in production use.
      - name: Run list-objects and list-users against the example model
        run: |
          ./fgaperf all -config examples/config.yaml -warmup 2s -duration 4s -endpoint list-objects
          ./fgaperf all -config examples/config.yaml -warmup 2s -duration 4s -endpoint list-users
      # Smoke the gRPC transport so a break in the gRPC client (stub drift, dial,
      # message conversion) fails CI rather than surfacing only in production use.
      - name: Run the gRPC transport against the example model
        run: ./fgaperf all -config examples/config.yaml -warmup 2s -duration 8s -transport grpc
      - name: Verify automatic cleanup left no stores behind
        run: |
          count=$(curl -s http://localhost:8080/stores | jq '.stores | length')
          echo "stores remaining: $count"
          test "$count" -eq 0

  # Performance-regression gate: prove the `compare -against-baseline` gate both
  # passes a healthy run and fails an injected regression. This is the
  # self-test of the recipe in docs/ci-regression-gate.md; a real project would
  # check in (or cache) a baseline produced from a representative run instead of
  # forging one here.
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o fgaperf .
      - name: Start OpenFGA
        run: |
          docker run -d --name openfga -p 8080:8080 openfga/openfga:latest run
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "OpenFGA did not become healthy" >&2
          docker logs openfga >&2
          exit 1
      - name: Run the pipeline and save a baseline
        run: |
          ./fgaperf all -config examples/config.yaml -warmup 2s -duration 8s -output-dir results
          RESULTS=$(ls -t results/results-*.json | head -1)
          echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"
          ./fgaperf baseline save -output-dir results "$RESULTS"
          cp "$(ls -t results/baseline-*.json | head -1)" results/baseline.json
      - name: Gate the run against the baseline (expected to pass)
        run: ./fgaperf compare -against-baseline results/baseline.json -output-dir results "$RESULTS"
      - name: Fail the gate on an injected regression (expected to fail)
        run: |
          # Forge an unbeatable baseline (1 ns p99, absurd throughput) so the
          # current run necessarily regresses and the gate must exit non-zero.
          jq '.overall.p99_ns = 1 | .throughput_per_sec = 1e12' results/baseline.json > results/impossible-baseline.json
          if ./fgaperf compare -against-baseline results/impossible-baseline.json -output-dir results "$RESULTS"; then
            echo "regression gate did not fail on an injected regression" >&2
            exit 1
          fi
          echo "regression gate correctly failed on the injected regression"
      - name: Verify automatic cleanup left no stores behind
        run: |
          count=$(curl -s http://localhost:8080/stores | jq '.stores | length')
          echo "stores remaining: $count"
          test "$count" -eq 0
